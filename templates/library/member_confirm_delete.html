{% extends 'base.html' %}

{% block title %}Delete Member - Smart Library{% endblock %}

{% block content %}
<div class="dashboard-layout">
    {% include 'includes/admin_sidebar.html' %}

    <div class="dashboard-content">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4 text-center bg-white">
                    <div class="my-3">
                        <i class="fa-solid fa-user-xmark text-danger fs-1"></i>
                    </div>
                    <h4 class="fw-bold mb-2">Delete Member Record?</h4>
                    <p class="text-muted">
                        Are you sure you want to remove member <strong>"{{ member.name }}"</strong> ({{ member.member_id }})?
                    </p>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2 mt-4">
                            <a href="{% url 'member_list' %}" class="btn btn-light px-4">Cancel</a>
                            <button type="submit" class="btn btn-danger px-4"><i class="fa-solid fa-trash me-1"></i> Confirm Delete</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
