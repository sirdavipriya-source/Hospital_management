{% extends 'base.html' %}

{% block title %}Delete Doctor - MedCare Admin{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="medical-card p-4 text-center">
                <i class="fa-solid fa-triangle-exclamation text-danger display-3 mb-3"></i>
                <h3 class="fw-bold mb-2">Remove Doctor from System?</h3>
                <p class="text-muted mb-4">Are you certain you want to permanently delete <strong>Dr. {{ doctor.name }}</strong>? All their appointment associations will be affected.</p>
                <form method="POST" action="">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'doctor_admin' %}" class="btn btn-outline-secondary btn-lg px-4">Cancel</a>
                        <button type="submit" class="btn btn-danger btn-lg px-4">
                            <i class="fa-solid fa-trash me-2"></i> Yes, Delete Doctor
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
