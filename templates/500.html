{% extends 'base.html' %}

{% block title %}Server Error (500) - MedCare{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="display-1 fw-extrabold text-danger mb-2">500</div>
    <h2 class="fw-bold mb-3">Internal Server Error</h2>
    <p class="text-muted fs-5 mb-4 max-w-500 mx-auto">An unexpected system error occurred while processing your medical request. Our technical staff has been notified.</p>
    <a href="{% url 'home' %}" class="btn btn-primary btn-lg shadow">
        <i class="fa-solid fa-house me-2"></i> Return to Homepage
    </a>
</div>
{% endblock %}
